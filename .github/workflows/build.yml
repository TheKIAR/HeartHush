name: Build HeartHush APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Test shared logic
        run: gradle -p android :shared:desktopTest
      - name: Build debug APK
        run: |
          gradle -p android :androidApp:assembleDebug
          cp android/androidApp/build/outputs/apk/debug/androidApp-debug.apk HeartHush-debug.apk
      - name: Commit updated APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot].users.noreply.github.com"
          git add HeartHush-debug.apk
          if git diff --cached --quiet; then
            echo "No APK changes to commit."
          else
            git commit -m "Build updated HeartHush-debug.apk"
            git push
          fi
