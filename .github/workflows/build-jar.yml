name: Build and update HeartHush.jar

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "manifest.txt"
      - "build.bat"
      - ".github/workflows/build-jar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Kotlin
        run: |
          curl -sL -o kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip
          unzip -q kotlin-compiler.zip -d "$HOME/kotlin"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile and test
        shell: bash
        run: |
          rm -rf classes
          mkdir -p classes
          kotlinc src/countdown/*.kt -jvm-target 1.8 -d classes
          STDLIB="$HOME/kotlin/kotlinc/lib/kotlin-stdlib.jar"
          java -cp "classes:$STDLIB" countdown.SelfTest
      - name: Package executable JAR
        run: |
          STDLIB="$HOME/kotlin/kotlinc/lib/kotlin-stdlib.jar"
          (cd classes && jar xf "$STDLIB" && rm -rf META-INF)
          echo "Main-Class: countdown.Main" > manifest.txt
          jar cfm HeartHush.jar manifest.txt -C classes .
      - name: Commit updated JAR
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot].users.noreply.github.com"
          git add HeartHush.jar manifest.txt
          if git diff --cached --quiet; then
            echo "No JAR changes to commit."
          else
            git commit -m "Build updated HeartHush.jar"
            git push
          fi
