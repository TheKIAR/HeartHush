name: Build Secount exe + APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Windows runner: jpackage Exe needs Windows; Android SDK works here too.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        shell: pwsh
        run: |
          curl.exe -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          Expand-Archive -Path gradle.zip -DestinationPath "$HOME/gradle" -Force
          "$HOME/gradle/gradle-8.13/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Test shared logic
        shell: pwsh
        run: gradle -p android :shared:desktopTest
      - name: Build jar + exe + APK
        shell: pwsh
        run: |
          gradle -p android :desktopApp:packageUberJarForCurrentOS :desktopApp:packageExe :androidApp:assembleDebug
          $jars = Get-ChildItem android/desktopApp/build/compose/jars/*.jar
          if ($jars.Count -eq 0) { throw "No jar built" }
          Copy-Item -Force $jars[0].FullName Secount.jar
          Copy-Item -Force android/desktopApp/build/compose/binaries/main/exe/Secount-1.0.0.exe Secount.exe
          Copy-Item -Force android/androidApp/build/outputs/apk/debug/androidApp-debug.apk Secount-debug.apk
      - name: Commit updated binaries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot].users.noreply.github.com"
          git add Secount.jar Secount.exe Secount-debug.apk
          if git diff --cached --quiet; then
            echo "No binary changes to commit."
          else
            git commit -m "Build updated Secount.jar + Secount.exe + Secount-debug.apk"
            git push
          fi
