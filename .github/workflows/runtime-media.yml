name: Capture Secount runtime media

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/runtime-screenshot.png"
      - "assets/runtime-locked.png"
      - "assets/runtime-unlocked.png"
      - "assets/demo.gif"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install capture tools
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick xdotool
      - name: Set up Gradle
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Build desktop app before launch
        run: gradle -p android :desktopApp:compileKotlin --no-daemon
      - name: Capture real locked and unlocked runtime
        shell: bash
        run: |
          set -e
          mkdir -p assets/capture-frames
          export DISPLAY=:99
          export HOME="$RUNNER_TEMP/secount-home"
          mkdir -p "$HOME"

          # Force this clean demo instance through the real app lock flow.
          # PinLock's default PIN is 1234.
          mkdir -p "$HOME/.java/.userPrefs/secount"
          cat > "$HOME/.java/.userPrefs/secount/prefs.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <!DOCTYPE map SYSTEM "http://java.sun.com/dtd/preferences.dtd">
          <map MAP_XML_VERSION="1.0">
            <entry key="secount_need_lock" value="true"/>
          </map>
          EOF

          Xvfb :99 -screen 0 1200x900x24 >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          sleep 2

          gradle -p android :desktopApp:run --no-daemon > /tmp/secount.log 2>&1 &
          APP_PID=$!

          WID=""
          for i in $(seq 1 180); do
            WID=$(xdotool search --name "Secount" 2>/dev/null | head -n 1 || true)
            if [ -n "$WID" ]; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Secount process exited before window appeared"
              cat /tmp/secount.log || true
              exit 1
            fi
            sleep 1
          done
          if [ -z "$WID" ]; then
            echo "Secount window not found after 180 seconds"
            cat /tmp/secount.log || true
            exit 1
          fi

          sleep 5
          import -window root assets/runtime-locked.png

          # Unlock the real UI with the requested PIN.
          xdotool type --window "$WID" "1234"
          xdotool key --window "$WID" Return
          sleep 5
          import -window root assets/runtime-unlocked.png

          # Real interaction GIF: locked screen -> PIN entry -> unlocked app.
          rm -f assets/capture-frames/*.png
          for i in $(seq -w 00 07); do
            import -window root "assets/capture-frames/locked-$i.png"
            sleep 0.25
          done
          xdotool type --window "$WID" "1234"
          sleep 0.3
          xdotool key --window "$WID" Return
          for i in $(seq -w 08 23); do
            import -window root "assets/capture-frames/unlocked-$i.png"
            sleep 0.30
          done

          convert -delay 10 -loop 0 assets/capture-frames/*.png assets/demo.gif
          test -s assets/runtime-locked.png
          test -s assets/runtime-unlocked.png
          test -s assets/demo.gif
          rm -rf assets/capture-frames
          kill "$APP_PID" 2>/dev/null || true

      - name: Commit runtime media
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/runtime-locked.png assets/runtime-unlocked.png assets/demo.gif
          git rm --cached --ignore-unmatch assets/runtime-screenshot.png || true
          rm -f assets/runtime-screenshot.png
          if git diff --cached --quiet; then
            echo "No runtime media changes."
          else
            git commit -m "Update Secount locked and unlocked runtime media"
            git push
          fi
