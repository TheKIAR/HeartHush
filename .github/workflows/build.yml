name: Build HeartHush.jar and APK

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "manifest.txt"
      - "build.bat"
      - "android/build-apk.bat"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Kotlin
        run: |
          curl -sL -o kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip
          unzip -q kotlin-compiler.zip -d "$HOME/kotlin"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Compile desktop and test
        shell: bash
        run: |
          rm -rf classes
          mkdir -p classes
          kotlinc src/countdown/*.kt -jvm-target 1.8 -d classes
          STDLIB="$HOME/kotlin/kotlinc/lib/kotlin-stdlib.jar"
          java -cp "classes:$STDLIB" countdown.SelfTest
      - name: Package executable JAR
        run: |
          STDLIB="$HOME/kotlin/kotlinc/lib/kotlin-stdlib.jar"
          (cd classes && jar xf "$STDLIB" && rm -rf META-INF)
          echo "Main-Class: countdown.Main" > manifest.txt
          jar cfm HeartHush.jar manifest.txt -C classes .
      - name: Build debug APK
        run: |
          gradle -p android assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk HeartHush-debug.apk
      - name: Commit updated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot].users.noreply.github.com"
          git add HeartHush.jar HeartHush-debug.apk manifest.txt
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "Build updated HeartHush.jar and HeartHush-debug.apk"
            git push
          fi
